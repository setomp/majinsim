<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲームステータスシミュレーター</title>
    <!-- Tailwind CSS (デザイン用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; color: #1f2937; font-family: 'Helvetica Neue', Arial, sans-serif; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .input-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; color: #4b5563; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 1rem; box-sizing: border-box; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; ring: 2px solid #93c5fd; }
        button { width: 100%; padding: 12px; background-color: #2563eb; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background-color: #1d4ed8; }
        .btn-secondary { background-color: #6b7280; margin-top: 5px; }
        .btn-secondary:hover { background-color: #4b5563; }
        .result-box { background-color: #ecfdf5; border: 1px solid #10b981; color: #065f46; }
        .stat-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #e5e7eb; align-items: center; }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { font-weight: bold; width: 100px; }
        .stat-value { font-family: monospace; font-size: 1.1em; }
        .stat-after { font-size: 0.8em; color: #6b7280; margin-left: 10px; }
        .warning-text { color: #dc2626; font-size: 0.8rem; margin-top: 4px; }
        textarea { height: 150px; font-family: monospace; }
        /* スライダー用スタイル */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #2563eb; cursor: pointer; margin-top: -8px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #d1d5db; border-radius: 2px; }
        .slider-value { font-weight: bold; color: #2563eb; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold mb-6 text-center">ステータスシミュレーター</h1>

        <!-- 1. ベースステータス入力 -->
        <div class="card">
            <h2 class="text-lg font-bold mb-4 border-b pb-2">1. ベースステータス</h2>
            
            <!-- 一括貼り付けエリア -->
            <div class="mb-6 bg-gray-50 p-4 rounded border border-gray-200">
                <label class="mb-2">ステータス一括貼り付け</label>
                <textarea id="pasteArea" placeholder="ここにステータスログを貼り付けてください&#10;例: 最大HP: 4,854,659&#10;腕力: 2,390,873"></textarea>
                <button class="btn-secondary" onclick="applyPaste()">貼り付けを適用する</button>
                <p class="text-xs text-gray-500 mt-2">※貼り付け後、自動的に計算されます。</p>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="input-group">
                    <label>騎士団レベル</label>
                    <select id="knightLevel" class="auto-update-trigger">
                        <!-- JSで生成 -->
                    </select>
                </div>
                <div class="input-group">
                    <label>転生回数</label>
                    <select id="rebirthCount" class="auto-update-trigger">
                        <!-- JSで生成 -->
                    </select>
                </div>
                
                <div class="input-group">
                    <label>最大HP</label>
                    <input type="number" id="maxHp" value="1000" class="auto-update-trigger">
                </div>
                <div class="input-group">
                    <label>腕力</label>
                    <input type="number" id="str" value="10" class="auto-update-trigger">
                </div>
                <div class="input-group">
                    <label>知能</label>
                    <input type="number" id="int" value="10" class="auto-update-trigger">
                </div>
                <div class="input-group">
                    <label>生命力</label>
                    <input type="number" id="vitality" value="10" class="auto-update-trigger">
                </div>
                <div class="input-group">
                    <label>器用さ</label>
                    <input type="number" id="dexterity" value="10" class="auto-update-trigger">
                </div>
                <div class="input-group">
                    <label>速さ</label>
                    <input type="number" id="speed" value="10" class="auto-update-trigger">
                </div>
                <div class="input-group">
                    <label>魅力</label>
                    <input type="number" id="charm" value="10" class="auto-update-trigger">
                </div>
                <div class="input-group">
                    <label>魔力</label>
                    <input type="number" id="magic" value="10" class="auto-update-trigger">
                </div>
                <div class="input-group">
                    <label>運</label>
                    <input type="number" id="luck" value="10" class="auto-update-trigger">
                </div>
            </div>
        </div>

        <!-- 2. 腎臓の状態 -->
        <div class="card border-l-4 border-yellow-500">
            <h2 class="text-lg font-bold mb-4 border-b pb-2">2. 腎臓の状態</h2>
            <div class="input-group">
                <label>状態を選択</label>
                <select id="kidneyStatus" class="auto-update-trigger">
                    <option value="healthy">健康 (変化なし)</option>
                    <option value="sold">売却済み (-50%)</option>
                </select>
                <div id="kidneyWarning" class="warning-text hidden">※売却済みの場合、全ステータスが50%になります。</div>
            </div>
        </div>

        <!-- 3. 防具設定 -->
        <div class="card">
            <h2 class="text-lg font-bold mb-4 border-b pb-2">3. 防具</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="input-group">
                    <label>防具の種類</label>
                    <select id="armorType" class="auto-update-trigger">
                        <option value="null">なし (Null)</option>
                        <option value="unease">ぼんやりとした不安</option>
                        <option value="monochrome_timer">モノクロタイマー</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>強化レベル</label>
                    <select id="armorEnhance" class="auto-update-trigger">
                        <!-- JavaScriptで0~8を自動生成 (タイマー用) -->
                    </select>
                </div>
            </div>
        </div>

        <!-- 4. 装身具設定 -->
        <div class="card">
            <h2 class="text-lg font-bold mb-4 border-b pb-2">4. 装身具</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="input-group">
                    <label>装身具の種類</label>
                    <select id="accessoryType" class="auto-update-trigger">
                        <option value="null">なし (Null)</option>
                        <option value="weak_pendant">弱者のペンダント</option>
                        <option value="blue_storm">青嵐</option>
                        <optgroup label="お守りシリーズ">
                            <option value="copper_amulet">銅のお守り (+5% +Lv5%)</option>
                            <option value="iron_amulet">鉄のお守り (+10% +Lv10%)</option>
                            <option value="silver_amulet">銀のお守り (+15% +Lv10%)</option>
                            <option value="gold_amulet">金のお守り (+20% +Lv10%)</option>
                            <option value="platinum_amulet">プラチナのお守り (+25% +Lv15%)</option>
                        </optgroup>
                    </select>
                </div>
                <div class="input-group">
                    <label>強化レベル</label>
                    <select id="accessoryEnhance" class="auto-update-trigger">
                        <!-- JavaScriptで0~16を自動生成 -->
                    </select>
                </div>
            </div>
        </div>

        <!-- 5. 最終調整スライダー -->
        <div class="card border-l-4 border-purple-500">
            <h2 class="text-lg font-bold mb-4 border-b pb-2">5. 最終調整</h2>
            <div class="input-group">
                <label>ステータス倍率調整 (<span id="sliderValueDisplay" class="slider-value">0%</span>)</label>
                <input type="range" id="adjustSlider" min="-1000" max="1000" value="0" class="auto-update-trigger mb-2">
                <input type="number" id="adjustInput" value="0" class="auto-update-trigger" placeholder="例: 10 (10%)">
                <p class="text-xs text-gray-500 mt-2">※手入力の符号なしはプラス判定。最終計算結果に掛かります。</p>
            </div>
        </div>

        <!-- 計算ボタン -->
        <button onclick="calculateStats()">ステータスを再計算する</button>

        <!-- 結果表示 -->
        <div id="resultArea" class="card result-box mt-6 hidden">
            <h2 class="text-lg font-bold mb-2">計算結果</h2>
            <div id="resultContent" class="text-sm">
                <!-- ここに結果が入ります -->
            </div>
        </div>
    </div>

    <script>
        // 初期化処理
        window.onload = function() {
            // 騎士団レベル (1-100)
            const knightLevelSelect = document.getElementById('knightLevel');
            for (let i = 1; i <= 100; i++) {
                let opt = new Option(`レベル ${i}`, i);
                knightLevelSelect.add(opt);
            }
            knightLevelSelect.value = 19;

            // 転生回数 (0-50)
            const rebirthSelect = document.getElementById('rebirthCount');
            for (let i = 0; i <= 50; i++) {
                let opt = new Option(`${i}回`, i);
                rebirthSelect.add(opt);
            }
            rebirthSelect.value = 0;

            // 防具強化レベル (モノクロタイマー対応で0-8まで)
            const armorEnhanceSelect = document.getElementById('armorEnhance');
            for (let i = 0; i <= 8; i++) {
                let option1 = new Option(`+${i}`, i);
                armorEnhanceSelect.add(option1);
            }
            document.getElementById('armorEnhance').value = 0;

            // 装身具強化レベル (0-16)
            const accEnhanceSelect = document.getElementById('accessoryEnhance');
            for (let i = 0; i <= 16; i++) {
                let option2 = new Option(`+${i}`, i);
                accEnhanceSelect.add(option2);
            }
            document.getElementById('accessoryEnhance').value = 0;

            // 腎臓選択時の警告表示制御
            const kidneySelect = document.getElementById('kidneyStatus');
            kidneySelect.addEventListener('change', function() {
                const warning = document.getElementById('kidneyWarning');
                if (this.value === 'sold') {
                    warning.classList.remove('hidden');
                } else {
                    warning.classList.add('hidden');
                }
            });

            // スライダーと数値入力の同期
            const slider = document.getElementById('adjustSlider');
            const input = document.getElementById('adjustInput');
            const display = document.getElementById('sliderValueDisplay');

            slider.addEventListener('input', function() {
                input.value = this.value;
                display.textContent = (this.value > 0 ? '+' : '') + this.value + '%';
                calculateStats();
            });

            input.addEventListener('input', function() {
                let val = parseInt(this.value);
                if (isNaN(val)) val = 0;
                // 範囲制限
                if (val > 1000) val = 1000;
                if (val < -1000) val = -1000;
                
                slider.value = val;
                display.textContent = (val > 0 ? '+' : '') + val + '%';
                calculateStats();
            });

            // --- 自動更新設定 ---
            const triggers = document.querySelectorAll('.auto-update-trigger');
            triggers.forEach(el => {
                if (el.tagName === 'INPUT') {
                    el.addEventListener('input', calculateStats);
                } else {
                    el.addEventListener('change', calculateStats);
                }
            });

            // 初期計算実行
            calculateStats();
        };

        // 貼り付け処理関数
        function applyPaste() {
            const text = document.getElementById('pasteArea').value;
            if (!text) return;

            const mappings = {
                '最大HP': 'maxHp',
                '腕力': 'str',
                '知能': 'int',
                '生命力': 'vitality',
                '器用さ': 'dexterity',
                '速さ': 'speed',
                '魅力': 'charm',
                '魔力': 'magic',
                '運': 'luck'
            };

            const lines = text.split('\n');

            lines.forEach(line => {
                const match = line.match(/^(.*?)[:：]?\s*(\d[\d,]*)/);
                
                if (match) {
                    const label = match[1].trim();
                    const rawValue = match[2];
                    const inputId = mappings[label];
                    
                    if (inputId) {
                        const cleanValue = rawValue.replace(/,/g, '');
                        const inputEl = document.getElementById(inputId);
                        if (inputEl) {
                            inputEl.value = cleanValue;
                            inputEl.dispatchEvent(new Event('input'));
                        }
                    }
                }
            });
        }

        // カンマ区切り用の関数
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        // モノクロタイマーの倍率取得関数
        function getMonochromeMultiplier(level) {
            if (level === 0 || level === 1) return 2;
            if (level === 2 || level === 3) return 3;
            if (level === 4 || level === 5) return 4;
            if (level === 6 || level === 7) return 5;
            if (level === 8) return 6;
            return 1; // デフォルト
        }

        function calculateStats() {
            // 1. 入力値の取得
            const inputs = {
                knightLevel: parseInt(document.getElementById('knightLevel').value) || 0,
                rebirthCount: parseInt(document.getElementById('rebirthCount').value) || 0,
                kidneyStatus: document.getElementById('kidneyStatus').value,
                adjustPercent: parseInt(document.getElementById('adjustSlider').value) || 0,
                
                // 計算対象ステータス
                maxHp: parseFloat(document.getElementById('maxHp').value) || 0,
                str: parseFloat(document.getElementById('str').value) || 0,
                int: parseFloat(document.getElementById('int').value) || 0,
                vitality: parseFloat(document.getElementById('vitality').value) || 0,
                dexterity: parseFloat(document.getElementById('dexterity').value) || 0,
                speed: parseFloat(document.getElementById('speed').value) || 0,
                charm: parseFloat(document.getElementById('charm').value) || 0,
                magic: parseFloat(document.getElementById('magic').value) || 0,
                luck: parseFloat(document.getElementById('luck').value) || 0,
                
                armorType: document.getElementById('armorType').value,
                armorEnhance: parseInt(document.getElementById('armorEnhance').value),
                
                accType: document.getElementById('accessoryType').value,
                accEnhance: parseInt(document.getElementById('accessoryEnhance').value)
            };

            // 計算対象のステータスリスト
            const stats = [
                { key: 'maxHp', label: '最大HP' },
                { key: 'str', label: '腕力' },
                { key: 'int', label: '知能' },
                { key: 'vitality', label: '生命力' },
                { key: 'dexterity', label: '器用さ' },
                { key: 'speed', label: '速さ' },
                { key: 'charm', label: '魅力' },
                { key: 'magic', label: '魔力' },
                { key: 'luck', label: '運' }
            ];

            let resultHtml = '';
            
            // モノクロタイマーのフラグと倍率
            const isMonochrome = inputs.armorType === 'monochrome_timer';
            const monoMultiplier = isMonochrome ? getMonochromeMultiplier(inputs.armorEnhance) : 1;

            // 各ステータスに対して計算を実行
            stats.forEach(stat => {
                let baseValue = inputs[stat.key];
                let multiplier = 1.0;

                // 1. 騎士団レベルボーナス
                multiplier *= (1 + (inputs.knightLevel * 0.02));

                // 2. 腎臓の状態
                if (inputs.kidneyStatus === 'sold') {
                    multiplier *= 0.5;
                }

                // 3. 防具: "ぼんやりとした不安"の場合
                if (inputs.armorType === 'unease') {
                    const x = inputs.armorEnhance;
                    const reductionRate = (1 + x) / (3 + x);
                    const remainingRate = 1 - reductionRate;
                    multiplier *= remainingRate;
                }

                // 4. 装身具: "青嵐"の場合
                if (inputs.accType === 'blue_storm') {
                    const x = inputs.accEnhance;
                    const reductionRate = (1 + x) / (3 + x);
                    const remainingRate = 1 - reductionRate;
                    multiplier *= remainingRate;
                }

                // 5. 装身具: "弱者のペンダント"の場合
                if (inputs.accType === 'weak_pendant') {
                    const x = inputs.accEnhance;
                    const n = inputs.rebirthCount;
                    const bonus = (1 + 0.1 * x) * (1 + 0.1 * n);
                    multiplier *= bonus;
                }

                // 6. 装身具: お守りシリーズの場合
                if (inputs.accType.includes('amulet')) {
                    let baseBonus = 0;
                    let lvBonus = 0;
                    switch(inputs.accType) {
                        case 'copper_amulet': baseBonus = 0.05; lvBonus = 0.05; break;
                        case 'iron_amulet': baseBonus = 0.10; lvBonus = 0.10; break;
                        case 'silver_amulet': baseBonus = 0.15; lvBonus = 0.10; break;
                        case 'gold_amulet': baseBonus = 0.20; lvBonus = 0.10; break;
                        case 'platinum_amulet': baseBonus = 0.25; lvBonus = 0.15; break;
                    }
                    if (baseBonus > 0) {
                        const totalBonus = baseBonus + (inputs.accEnhance * lvBonus);
                        multiplier *= (1 + totalBonus);
                    }
                }

                // --- モノクロタイマー処理 ---
                // 通常時：倍率を掛ける
                let finalValueCurrent = baseValue * multiplier;
                if (isMonochrome) {
                    finalValueCurrent *= monoMultiplier;
                }

                // 5ターン目以降（減衰後）の計算
                // 論理：(ベース × 他バフ) + ((ベース × 他バフ) × (モノクロ倍率 - 1)) - (ベース × (モノクロ倍率 - 1))
                // つまり、モノクロで上がった分を「ベース値」から引くのではなく、「増加分」を引く処理
                // ご提示の例: 100万 -> 500万 (400万増) -> 弱者ペン9倍 -> 4500万 -> 減衰で400万引かれて4100万
                // これは「増加分」がバフの影響を**受けずに**引かれるという意味ではなく、
                // 「最終値から、(ベース値 × (モノクロ倍率-1)) を引く」という解釈が最も自然です。
                // ただし、ご提示の例では「弱者ペンダント9倍」は「100万」に対して掛かっているのか「500万」に対して掛かっているのか？
                // 例: 100 * 5 = 500. 500 * 9 = 4500. 4500 - (100 * 4) = 4460? 
                // 例: 100 * 5 = 500. 100 * 9 = 900. 500 + 900 = 1400? 
                // ご提示: "弱者のペンダント9倍=4500万なら...400万だけ引かれて残り4100万"
                // この計算式は: (100万 * 5 * 9) - (100万 * 4) = 4500 - 400 = 4100 となります。
                // つまり、**最終計算値から、(ベース値 × (モノクロ倍率 - 1)) を引く** というロジックです。

                let finalValueAfter = finalValueCurrent;
                if (isMonochrome && monoMultiplier > 1) {
                    // 増加分の除去: ベース値 × (倍率 - 1)
                    const increaseAmount = baseValue * (monoMultiplier - 1);
                    finalValueAfter = finalValueCurrent - increaseAmount;
                    if (finalValueAfter < 0) finalValueAfter = 0;
                }

                // --- 最終調整スライダー処理 ---
                // 値: -1000% 〜 +1000%
                // 倍率: 1 + (値 / 100)
                const adjustMultiplier = 1 + (inputs.adjustPercent / 100);
                
                // 現在の値に調整を適用
                finalValueCurrent = Math.floor(finalValueCurrent * adjustMultiplier);
                finalValueAfter = Math.floor(finalValueAfter * adjustMultiplier);

                // 結果HTMLの生成
                let afterText = '';
                if (isMonochrome) {
                    afterText = `<span class="stat-after">(5ターン目: ${formatNumber(finalValueAfter)})</span>`;
                }

                resultHtml += `
                    <div class="stat-row">
                        <span class="stat-label">${stat.label}</span>
                        <div class="flex items-center">
                            <span class="stat-value">${formatNumber(finalValueCurrent)}</span>
                            ${afterText}
                        </div>
                    </div>
                `;
            });

            // 結果表示エリアに挿入
            document.getElementById('resultContent').innerHTML = resultHtml;
            document.getElementById('resultArea').classList.remove('hidden');
        }
    </script>
</body>
</html>
