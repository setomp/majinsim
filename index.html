<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲームステータスシミュレーター</title>
    <!-- Tailwind CSS (デザイン用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; color: #1f2937; font-family: 'Helvetica Neue', Arial, sans-serif; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .input-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; color: #4b5563; }
        input, select { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 1rem; box-sizing: border-box; }
        input:focus, select:focus { outline: none; border-color: #2563eb; ring: 2px solid #93c5fd; }
        button { width: 100%; padding: 12px; background-color: #2563eb; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background-color: #1d4ed8; }
        .result-box { background-color: #ecfdf5; border: 1px solid #10b981; color: #065f46; }
        .stat-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #e5e7eb; }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { font-weight: bold; }
        .stat-value { font-family: monospace; font-size: 1.1em; }
        .warning-text { color: #dc2626; font-size: 0.8rem; margin-top: 4px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold mb-6 text-center">ステータスシミュレーター</h1>

        <!-- 1. ベースステータス入力 -->
        <div class="card">
            <h2 class="text-lg font-bold mb-4 border-b pb-2">1. ベースステータス</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="input-group">
                    <label>騎士団レベル</label>
                    <input type="number" id="knightLevel" value="19" min="1">
                </div>
                <div class="input-group">
                    <label>転生回数</label>
                    <input type="number" id="rebirthCount" value="0" min="0">
                </div>
                <!-- 計算対象のステータス -->
                <div class="input-group">
                    <label>最大HP</label>
                    <input type="number" id="maxHp" value="4854659">
                </div>
                <div class="input-group">
                    <label>腕力</label>
                    <input type="number" id="str" value="10">
                </div>
                <div class="input-group">
                    <label>知能</label>
                    <input type="number" id="int" value="10">
                </div>
                <div class="input-group">
                    <label>生命力</label>
                    <input type="number" id="vitality" value="10">
                </div>
                <div class="input-group">
                    <label>器用さ</label>
                    <input type="number" id="dexterity" value="10">
                </div>
                <div class="input-group">
                    <label>速さ</label>
                    <input type="number" id="speed" value="10">
                </div>
                <div class="input-group">
                    <label>魅力</label>
                    <input type="number" id="charm" value="10">
                </div>
                <div class="input-group">
                    <label>魔力</label>
                    <input type="number" id="magic" value="10">
                </div>
                <div class="input-group">
                    <label>運</label>
                    <input type="number" id="luck" value="10">
                </div>
            </div>
        </div>

        <!-- 2. 腎臓の状態 (新規追加) -->
        <div class="card border-l-4 border-yellow-500">
            <h2 class="text-lg font-bold mb-4 border-b pb-2">2. 腎臓の状態</h2>
            <div class="input-group">
                <label>状態を選択</label>
                <select id="kidneyStatus">
                    <option value="healthy">健康 (変化なし)</option>
                    <option value="sold">売却済み (-50%)</option>
                </select>
                <div id="kidneyWarning" class="warning-text hidden">※売却済みの場合、全ステータスが50%になります。</div>
            </div>
        </div>

        <!-- 3. 防具設定 -->
        <div class="card">
            <h2 class="text-lg font-bold mb-4 border-b pb-2">3. 防具</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="input-group">
                    <label>防具の種類</label>
                    <select id="armorType">
                        <option value="null">なし (Null)</option>
                        <option value="unease" selected>ぼんやりとした不安</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>強化レベル</label>
                    <select id="armorEnhance">
                        <!-- JavaScriptで0~16を自動生成 -->
                    </select>
                </div>
            </div>
        </div>

        <!-- 4. 装身具設定 -->
        <div class="card">
            <h2 class="text-lg font-bold mb-4 border-b pb-2">4. 装身具</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="input-group">
                    <label>装身具の種類</label>
                    <select id="accessoryType">
                        <option value="null">なし (Null)</option>
                        <option value="weak_pendant">弱者のペンダント</option>
                        <option value="blue_storm" selected>青嵐</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>強化レベル</label>
                    <select id="accessoryEnhance">
                        <!-- JavaScriptで0~16を自動生成 -->
                    </select>
                </div>
            </div>
        </div>

        <!-- 計算ボタン -->
        <button onclick="calculateStats()">ステータスを計算する</button>

        <!-- 結果表示 -->
        <div id="resultArea" class="card result-box mt-6 hidden">
            <h2 class="text-lg font-bold mb-2">計算結果</h2>
            <div id="resultContent" class="text-sm">
                <!-- ここに結果が入ります -->
            </div>
        </div>
    </div>

    <script>
        // ページ読み込み時に強化レベルのオプション(0-16)を生成
        window.onload = function() {
            const armorEnhanceSelect = document.getElementById('armorEnhance');
            const accEnhanceSelect = document.getElementById('accessoryEnhance');
            
            for (let i = 0; i <= 16; i++) {
                let option1 = new Option(`+${i}`, i);
                let option2 = new Option(`+${i}`, i);
                armorEnhanceSelect.add(option1);
                accEnhanceSelect.add(option2);
            }
            
            // デフォルト値を設定（テスト用）
            document.getElementById('armorEnhance').value = 2;
            document.getElementById('accessoryEnhance').value = 3;

            // 腎臓選択時の警告表示制御
            const kidneySelect = document.getElementById('kidneyStatus');
            kidneySelect.addEventListener('change', function() {
                const warning = document.getElementById('kidneyWarning');
                if (this.value === 'sold') {
                    warning.classList.remove('hidden');
                } else {
                    warning.classList.add('hidden');
                }
            });
        };

        // カンマ区切り用の関数
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function calculateStats() {
            // 1. 入力値の取得
            const inputs = {
                knightLevel: parseInt(document.getElementById('knightLevel').value) || 0,
                rebirthCount: parseInt(document.getElementById('rebirthCount').value) || 0,
                kidneyStatus: document.getElementById('kidneyStatus').value,
                
                // 計算対象ステータス
                maxHp: parseFloat(document.getElementById('maxHp').value) || 0,
                str: parseFloat(document.getElementById('str').value) || 0,
                int: parseFloat(document.getElementById('int').value) || 0,
                vitality: parseFloat(document.getElementById('vitality').value) || 0,
                dexterity: parseFloat(document.getElementById('dexterity').value) || 0,
                speed: parseFloat(document.getElementById('speed').value) || 0,
                charm: parseFloat(document.getElementById('charm').value) || 0,
                magic: parseFloat(document.getElementById('magic').value) || 0,
                luck: parseFloat(document.getElementById('luck').value) || 0,
                
                armorType: document.getElementById('armorType').value,
                armorEnhance: parseInt(document.getElementById('armorEnhance').value),
                
                accType: document.getElementById('accessoryType').value,
                accEnhance: parseInt(document.getElementById('accessoryEnhance').value)
            };

            // 計算対象のステータスリスト
            const stats = [
                { key: 'maxHp', label: '最大HP' },
                { key: 'str', label: '腕力' },
                { key: 'int', label: '知能' },
                { key: 'vitality', label: '生命力' },
                { key: 'dexterity', label: '器用さ' },
                { key: 'speed', label: '速さ' },
                { key: 'charm', label: '魅力' },
                { key: 'magic', label: '魔力' },
                { key: 'luck', label: '運' }
            ];

            let resultHtml = '';

            // 各ステータスに対して計算を実行
            stats.forEach(stat => {
                let baseValue = inputs[stat.key];
                let multiplier = 1.0;

                // 1. 騎士団レベルボーナス: レベル1につき+2%
                multiplier *= (1 + (inputs.knightLevel * 0.02));

                // 2. 腎臓の状態
                if (inputs.kidneyStatus === 'sold') {
                    multiplier *= 0.5; // 50%に減少
                }

                // 3. 防具: "ぼんやりとした不安"の場合
                // 減少率 = (1 + x) / (3 + x)
                // 残存率 = 1 - 減少率
                if (inputs.armorType === 'unease') {
                    const x = inputs.armorEnhance;
                    const reductionRate = (1 + x) / (3 + x);
                    const remainingRate = 1 - reductionRate;
                    multiplier *= remainingRate;
                }

                // 4. 装身具: "青嵐"の場合
                // 減少率 = (1 + x) / (3 + x)
                // 残存率 = 1 - 減少率
                if (inputs.accType === 'blue_storm') {
                    const x = inputs.accEnhance;
                    const reductionRate = (1 + x) / (3 + x);
                    const remainingRate = 1 - reductionRate;
                    multiplier *= remainingRate;
                }

                // 5. 装身具: "弱者のペンダント"の場合
                // 式: (1 + 0.1x) * (1 + 0.1n)
                if (inputs.accType === 'weak_pendant') {
                    const x = inputs.accEnhance;
                    const n = inputs.rebirthCount;
                    const bonus = (1 + 0.1 * x) * (1 + 0.1 * n);
                    multiplier *= bonus;
                }

                // 最終値の算出 (小数点以下切り捨て)
                let finalValue = Math.floor(baseValue * multiplier);
                
                // 結果HTMLの生成
                resultHtml += `
                    <div class="stat-row">
                        <span class="stat-label">${stat.label}</span>
                        <span class="stat-value">${formatNumber(finalValue)}</span>
                    </div>
                `;
            });

            // 結果表示エリアに挿入
            document.getElementById('resultContent').innerHTML = resultHtml;
            document.getElementById('resultArea').classList.remove('hidden');
        }
    </script>
</body>
</html>
